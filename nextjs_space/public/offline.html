<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BütçeM — Çevrimdışı</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 72px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #10b981; margin-bottom: 12px; }
    p { font-size: 15px; color: #64748b; line-height: 1.7; }
    button {
      margin-top: 32px;
      padding: 14px 40px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #059669; }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>Bağlantı Yok</h1>
    <p>BütçeM'e bağlanmak için<br>internet bağlantısına ihtiyacın var.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
